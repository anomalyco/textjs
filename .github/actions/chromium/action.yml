# ▼ Chromium's headless shell for playwright-core (headless launches use it),
# cached per Playwright version. The system libraries it needs come from apt on
# every run; the browser download is what the cache saves. Run after the Setup action.

name: Chromium
description: Install Playwright's headless Chromium shell and the system libraries it needs.

runs:
  using: composite
  steps:
    - name: Read the playwright-core version
      id: playwright
      shell: bash
      run: echo "version=$(jq -r '.devDependencies["playwright-core"] // .dependencies["playwright-core"]' apps/web/package.json)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-headless-shell

    - name: Install system libraries
      shell: bash
      working-directory: apps/web
      run: bunx playwright-core install-deps chromium

    - name: Install Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: apps/web
      run: bunx playwright-core install --only-shell chromium
