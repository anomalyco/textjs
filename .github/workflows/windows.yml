# ▼ Windows: the packages' build, typecheck and tests; this checkout's build of
# textjs.org in headful Chrome and Edge with DevTools docked, driven by real OS
# keystrokes (US, German and Japanese IME), with chart glyphs checked in Consolas alone
# (Windows 10's console font); and, by hand, what a new user runs
# from npm (create-text-app with bunx and npx, text build, text dev, the bridge).
#
# The Packages and Browser jobs run only when something they cover changed.
# Screenshots and raw key logs are uploaded as the `windows-browser-*` artifacts.

name: Windows

on:
  pull_request:
    branches: [dev, production]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      version:
        description: create-text-app and @textjs/opencode version (or dist-tag) to smoke test from npm
        default: latest

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # list a pull request's files
    outputs:
      packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages == 'true' }}
      browser: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.browser == 'true' }}
    steps:
      # Pushes are compared with the previous commit on the branch, which needs the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            packages:
              - packages/**
              - examples/dashboard/**
              - scripts/**
              - package.json
              - bun.lock
              - tsconfig.base.json
              - .gitattributes
              - .github/actions/setup/**
              - .github/workflows/windows.yml
            browser:
              - apps/web/**
              - apps/terminal-shop/**
              - apps/opencode-console/**
              - packages/**
              - scripts/windows/**
              - bench/devtools/glyph-*
              - package.json
              - bun.lock
              - .github/actions/setup/**
              - .github/workflows/windows.yml

  packages:
    name: Packages (build, typecheck, test)
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test packages/

      # This checkout's packages, packed the way npm ships them, under Node and Bun.
      - name: Packed packages
        run: bun scripts/verify-pack.ts --skip-build

  # What users get from npm today, so it runs by hand (after a release). Pull requests
  # cover this checkout's packages in the packages job (verify-pack, template builds).
  cli:
    name: CLI (create-text-app, text, bridge)
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Bun itself: the smoke test installs from npm into a temp directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Smoke test
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: node scripts/windows/cli-smoke.mjs --version "$VERSION" --json "$RUNNER_TEMP/cli.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-cli
          path: ${{ runner.temp }}/cli.json
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    # GitHub-hosted: Blacksmith's Windows runner runs jobs in session 0 with no desktop,
    # so it can't show a browser window, take screenshots or receive SendInput.
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Display and input languages
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $_" }
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          # German comes from LoadKeyboardLayout. The Japanese IME needs the language in the user's list.
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList $list -Force

      - uses: ./.github/actions/setup
        with:
          install-dirs: bench/devtools # playwright-core for the glyph check

      # The pull request's own site, so a check never depends on what's live on textjs.org.
      # The terminal.shop API points at a closed port, so /coffee shows the recorded catalogue.
      - name: Build and serve the site
        id: site
        env:
          TERMINAL_API_URL: http://127.0.0.1:9
          TERMINAL_AUTH_URL: http://127.0.0.1:9
        run: |
          bun run build:packages
          bun run --cwd apps/web build
          cd apps/web
          nohup bunx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:4173/playground > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/playground > /dev/null || { cat "$RUNNER_TEMP/preview.log"; exit 1; }

      # Windows 10 has no Cascadia Mono, so its console draws frames in Consolas, which lacks
      # eighth blocks, quadrants, braille, ▶ and ✓. Forcing Consolas alone simulates it.
      # Before the site check, whose browser stays open: a second Chrome would hand off to it.
      - name: Chart glyphs in Consolas (${{ matrix.browser }})
        run: bun bench/devtools/glyph-shot.ts --browser ${{ matrix.browser }} --out "$RUNNER_TEMP/browser/glyphs" --check

      - name: Check ${{ matrix.browser }}
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        run: node scripts/windows/browser-check.mjs --browser ${{ matrix.browser }} --origin http://localhost:4173 --out "$RUNNER_TEMP/browser"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore
