# ▼ Windows: the packages' build, typecheck and tests; what a new user runs from
# a terminal (create-text-app with bunx and npx, text build, text dev, the
# OpenCode bridge); and textjs.org in headful Chrome and Edge with DevTools
# docked, driven by real OS keystrokes (US, German and Japanese IME).
#
# Runs on changes that can break Windows, and by hand from the Actions tab.
# Screenshots and raw key logs are uploaded as the `windows-browser-*` artifacts.

name: Windows

on:
  pull_request:
    branches: [dev, production]
    paths:
      - "packages/**"
      - "scripts/windows/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows.yml"
  push:
    branches: [dev]
    paths:
      - "packages/**"
      - "scripts/windows/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: create-text-app and @textjs/opencode version to smoke test from npm
        default: latest
      origin:
        description: Site to check in Chrome and Edge
        default: https://textjs.org

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Packages (build, typecheck, test)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test packages/

      # This checkout's packages, packed the way npm ships them, under Node and Bun.
      - name: Packed packages
        run: bun scripts/verify-pack.ts --skip-build

  cli:
    name: CLI (create-text-app, text, bridge)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Smoke test
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: node scripts/windows/cli-smoke.mjs --version "$VERSION" --json "$RUNNER_TEMP/cli.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-cli
          path: ${{ runner.temp }}/cli.json
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.browser }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
        runner: [blacksmith-4vcpu-windows-2025, windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Display and input languages
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "Session $((Get-Process -Id $PID).SessionId), interactive $([Environment]::UserInteractive), user $env:USERNAME"
          query user 2>&1
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $_" }
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          # German comes from LoadKeyboardLayout. The Japanese IME needs the language in the user's list.
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips

      - name: Check ${{ matrix.browser }}
        env:
          ORIGIN: ${{ inputs.origin || 'https://textjs.org' }}
        run: node scripts/windows/browser-check.mjs --browser ${{ matrix.browser }} --origin "$ORIGIN" --out "$RUNNER_TEMP/browser"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-browser-${{ matrix.browser }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore
