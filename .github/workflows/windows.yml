# ▼ Windows: the packages' build, typecheck and tests; what a new user runs from
# a terminal (create-text-app with bunx and npx, text build, text dev, the
# OpenCode bridge); and this checkout's build of textjs.org in headful Chrome and
# Edge with DevTools docked, driven by real OS keystrokes (US, German and Japanese IME).
#
# Runs on changes that can break Windows, and by hand from the Actions tab.
# Screenshots and raw key logs are uploaded as the `windows-browser-*` artifacts.

name: Windows

on:
  pull_request:
    branches: [dev, production]
    paths:
      - "packages/**"
      - "apps/web/**"
      - "scripts/windows/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows.yml"
  push:
    branches: [dev]
    paths:
      - "packages/**"
      - "apps/web/**"
      - "scripts/windows/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: create-text-app and @textjs/opencode version to smoke test from npm
        default: latest

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  packages:
    name: Packages (build, typecheck, test)
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:packages

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test packages/

      # This checkout's packages, packed the way npm ships them, under Node and Bun.
      - name: Packed packages
        run: bun scripts/verify-pack.ts --skip-build

  # What users get from npm today, so it runs by hand (after a release). Pull requests
  # cover this checkout's packages in the packages job (verify-pack, template builds).
  cli:
    name: CLI (create-text-app, text, bridge)
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Smoke test
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: node scripts/windows/cli-smoke.mjs --version "$VERSION" --json "$RUNNER_TEMP/cli.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-cli
          path: ${{ runner.temp }}/cli.json
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.browser }})
    # GitHub-hosted: Blacksmith's Windows runner runs jobs in session 0 with no desktop,
    # so it can't show a browser window, take screenshots or receive SendInput.
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Display and input languages
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop } catch { "Set-DisplayResolution: $_" }
          "Screen: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"
          # German comes from LoadKeyboardLayout. The Japanese IME needs the language in the user's list.
          $list = Get-WinUserLanguageList
          $list.Add("ja-JP")
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # The pull request's own site, so a check never depends on what's live on textjs.org.
      - name: Build and serve the site
        run: |
          bun run build:packages
          bun run --cwd apps/web build
          cd apps/web
          nohup bunx vite preview --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:4173/playground > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4173/playground > /dev/null || { cat "$RUNNER_TEMP/preview.log"; exit 1; }

      - name: Check ${{ matrix.browser }}
        run: node scripts/windows/browser-check.mjs --browser ${{ matrix.browser }} --origin http://localhost:4173 --out "$RUNNER_TEMP/browser"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-browser-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser
          if-no-files-found: ignore
