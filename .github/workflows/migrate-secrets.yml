name: Migrate secrets

# Temporary: copies the GitHub environment secrets to AWS Secrets Manager,
# then reads them back to prove the new roles work. Removed after the migration.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/textjs-dev
          aws-region: us-east-1
      - name: Copy CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$V" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          aws secretsmanager put-secret-value --secret-id textjs/dev/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,textjs/dev/CLOUDFLARE_API_TOKEN
          parse-json-secrets: false
      - name: Verify
        run: test -n "$CLOUDFLARE_API_TOKEN" && echo CLOUDFLARE_API_TOKEN ok

  production:
    if: github.ref_name == 'production'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/textjs-production
          aws-region: us-east-1
      - name: Copy CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$V" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          aws secretsmanager put-secret-value --secret-id textjs/production/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
      - name: Copy CLOUDFLARE_WORKERS_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
        run: |
          if [ -z "$V" ]; then
            echo "::error::CLOUDFLARE_WORKERS_TOKEN is empty"
            exit 1
          fi
          aws secretsmanager put-secret-value --secret-id textjs/production/CLOUDFLARE_WORKERS_TOKEN --secret-string "$V" > /dev/null
      - uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: |
            CLOUDFLARE_API_TOKEN,textjs/production/CLOUDFLARE_API_TOKEN
            CLOUDFLARE_WORKERS_TOKEN,textjs/production/CLOUDFLARE_WORKERS_TOKEN
          parse-json-secrets: false
      - name: Verify
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && echo CLOUDFLARE_API_TOKEN ok
          test -n "$CLOUDFLARE_WORKERS_TOKEN" && echo CLOUDFLARE_WORKERS_TOKEN ok
