# ▼ Keeps a draft pull request from dev to production open whenever dev is ahead.
# New commits on dev join it. Merging it with a merge commit ships textjs.org
# (deploy.yml deploys every push to production).

name: Promotion PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promotion-pr
  cancel-in-progress: false

jobs:
  promotion:
    name: Open draft promotion PR
    if: github.repository == 'anomalyco/textjs'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Ensure a dev to production PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.repository_owner }}:dev
        run: |
          set -euo pipefail

          # Filter on owner:branch so a fork's dev branch can't stand in for this one.
          pr="$(gh api "repos/$GH_REPO/pulls?state=open&base=production&head=$PR_HEAD" --jq '.[0].html_url // empty')"
          if [[ -n "$pr" ]]; then
            echo "Promotion PR already open: $pr"
            exit 0
          fi

          changes="$(gh api "repos/$GH_REPO/compare/production...dev" --jq '.ahead_by > 0 and (.files | length > 0)')"
          if [[ "$changes" != "true" ]]; then
            echo "No changes to promote."
            exit 0
          fi

          # Runs for a PR opened with GITHUB_TOKEN wait for a maintainer's approval (since June 2026);
          # marking it Ready for review also starts CI and QA.
          gh pr create \
            --base production \
            --head dev \
            --draft \
            --title "chore(release): promote dev to production" \
            --body "Promote the latest changes from dev to production.

          Click **Ready for review** to run CI and QA starters, then merge with **Create a merge commit** once checks pass. The merge deploys https://textjs.org.

          New commits on dev automatically join this PR."
