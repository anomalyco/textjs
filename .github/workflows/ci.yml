# ▼ Typecheck and unit tests for pull requests to dev and production, and pushes to dev.
# Read-only and secret-free, so it runs the same on pull requests from forks.
#
# Typecheck, the package tests and the app tests run as parallel jobs, and each
# test job spreads its files over every core with `bun test --parallel`. The
# `Typecheck and test` job reports one status for all three.

name: CI

on:
  pull_request:
    branches: [dev, production]
    # ready_for_review: the draft promotion PR is opened by GITHUB_TOKEN, which starts no workflows.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  typecheck:
    name: Typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: |
          bun run typecheck
          bun run --cwd apps/web typecheck

  packages:
    name: Test packages
    # The longest file (packages/app/test/adapters.test.ts) sets the floor; past 8 cores the run stops getting shorter.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Test packages
        run: bun test packages/ --parallel

  apps:
    name: Test apps
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # og.test.ts renders an Open Graph image per route in headless Chromium.
      - uses: ./.github/actions/chromium

      - name: Test apps
        run: |
          bun run --cwd apps/opencode-console test
          bun run --cwd apps/web test
          bun run --cwd apps/terminal-shop test

  test:
    name: Typecheck and test
    needs: [typecheck, packages, apps]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "typecheck, packages, apps: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
