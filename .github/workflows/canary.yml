# ▼ Text.js canary channel.
#
# Every push to dev is verified and published as x.y.z-canary.N under the
# `canary` dist-tag with npm provenance. Without an NPM_TOKEN secret in the
# `npm-canary` environment, the job posts a notice and skips the rest.
# Canary versions are computed from the registry at publish time and are never
# committed back to the repository.
#
# Skip a push with `[skip canary]` in the head commit message.

name: Canary

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Least privilege by default; the publish job opts into OIDC for provenance.
permissions:
  contents: read

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  canary:
    name: Verify and publish canary
    # Only on the canonical repository: never on forks or pull requests.
    if: >-
      github.repository == 'anomalyco/textjs' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip canary]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-canary
    permissions:
      contents: read
      id-token: write # npm provenance (Sigstore OIDC)
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Check for NPM_TOKEN
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::notice::NPM_TOKEN isn't set in the npm-canary environment. Skipping the canary release."

      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        if: env.HAS_NPM_TOKEN == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: env.HAS_NPM_TOKEN == 'true'
        run: bun run typecheck

      - name: Test
        if: env.HAS_NPM_TOKEN == 'true'
        run: bun test packages/

      - name: Version (x.y.z-canary.N)
        if: env.HAS_NPM_TOKEN == 'true'
        id: version
        run: |
          bun scripts/release-version.ts canary --registry --json | tee version.json
          echo "version=$(node -p 'require("./version.json").to')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (canary)
        if: env.HAS_NPM_TOKEN == 'true'
        run: bun scripts/release-publish.ts --tag canary --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Summary
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "▼ Text.js ${VERSION} (canary)" >> "$GITHUB_STEP_SUMMARY"
